name: Tunnelo macOS

# Запуск вручную: GitHub -> Actions -> "Tunnelo macOS" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [build]
    paths:
      - 'lib/**'
      - 'core-overlay/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - '.github/workflows/tunnelo-macos.yml'

env:
  FLUTTER_VERSION: '3.38.5'
  GO_VERSION: '1.25'

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      # Вложенные субмодули hiddify-sing-box прописаны по SSH — переписываем
      # на HTTPS до чекаута, репозитории публичные.
      - name: Rewrite submodule SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ядро собираем из сабмодуля со своим оверлеем (IPv4-only, MTU,
      # правила для России), а не тянем чужой бинарник из релизов.
      - name: Apply core overlay
        run: cp core-overlay/v2/config/*.go hiddify-core/v2/config/
        shell: bash

      - name: Prepare (deps, кодогенерация)
        run: make macos-prepare
        shell: bash
        continue-on-error: true

      - name: Fallback prepare
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      # ВАЖНО: ядро собираем ПОСЛЕ подготовки. Шаг windows-prepare тянет
      # готовое ядро из чужих релизов и затирает наше — вместе со всеми
      # исправлениями (IPv4-only, MTU, правила для России). Собираем следом
      # и кладём поверх. CMake берёт DLL из hiddify-core/bin.
      # Ядро собираем ПОСЛЕ подготовки: шаг macos-prepare тянет готовое
      # ядро из чужих релизов и затирает наше — вместе со всеми
      # исправлениями (IPv4-only, MTU, правила для России).
      - name: Build core dylib
        shell: bash
        working-directory: hiddify-core
        env:
          CGO_ENABLED: '1'
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_conntrack
          for ARCH in amd64 arm64; do
            env GOOS=darwin GOARCH=$ARCH \
              CGO_CFLAGS="-mmacosx-version-min=10.15 -O2" \
              CGO_LDFLAGS="-mmacosx-version-min=10.15 -O2 -lpthread" \
              go build -trimpath -tags "$TAGS" -buildmode=c-shared \
              -o bin/hiddify-core-$ARCH.dylib ./platform/desktop
          done
          lipo -create bin/hiddify-core-amd64.dylib bin/hiddify-core-arm64.dylib -output bin/hiddify-core.dylib
          cp bin/hiddify-core-arm64.h bin/desktop.h || true
          ls -la bin/

      - name: Build macOS app
        run: flutter build macos --release --target lib/main_prod.dart

      - name: Проверить, что ядро наше
        shell: bash
        run: |
          ls -la hiddify-core/bin/hiddify-core.dylib
          find build/macos -name 'hiddify-core.dylib' -exec ls -la {} \;

      - name: Собрать результат
        shell: bash
        run: |
          mkdir -p out
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          echo "приложение: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/Tunnelo-macOS.zip
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: Tunnelo-macOS
          path: out/Tunnelo-macOS.zip
          if-no-files-found: error

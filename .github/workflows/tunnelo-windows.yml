name: Tunnelo Windows

# Запуск вручную: GitHub -> Actions -> "Tunnelo Windows" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [build]
    paths:
      - 'lib/**'
      - 'core-overlay/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - '.github/workflows/tunnelo-windows.yml'

env:
  FLUTTER_VERSION: '3.38.5'
  GO_VERSION: '1.25'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Вложенные субмодули hiddify-sing-box прописаны по SSH — переписываем
      # на HTTPS до чекаута, репозитории публичные.
      - name: Rewrite submodule SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ядро собираем из сабмодуля со своим оверлеем (IPv4-only, MTU,
      # правила для России), а не тянем чужой бинарник из релизов.
      - name: Apply core overlay
        run: cp core-overlay/v2/config/*.go hiddify-core/v2/config/
        shell: bash

      - name: Prepare (deps, кодогенерация)
        run: make windows-prepare
        shell: bash
        continue-on-error: true

      - name: Fallback prepare
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      # ВАЖНО: ядро собираем ПОСЛЕ подготовки. Шаг windows-prepare тянет
      # готовое ядро из чужих релизов и затирает наше — вместе со всеми
      # исправлениями (IPv4-only, MTU, правила для России). Собираем следом
      # и кладём поверх. CMake берёт DLL из hiddify-core/bin.
      - name: Build core DLL
        shell: bash
        working-directory: hiddify-core
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
        run: |
          TAGS=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_conntrack
          go build -buildmode=c-shared -trimpath \
            -ldflags="-w -s -checklinkname=0 -buildid=" \
            -tags "$TAGS" \
            -o bin/hiddify-core.dll ./platform/desktop
          ls -la bin/

      - name: Build Windows app
        run: flutter build windows --release --target lib/main_prod.dart

      - name: Проверить, что ядро наше
        shell: bash
        run: |
          ls -la hiddify-core/bin/hiddify-core.dll
          find build/windows -name 'hiddify-core.dll' -exec ls -la {} \;

      - name: Собрать результат
        shell: bash
        run: |
          mkdir -p out
          cd build/windows/x64/runner/Release && 7z a -tzip ../../../../../out/Tunnelo-Windows.zip . && cd -
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: Tunnelo-Windows
          path: out/Tunnelo-Windows.zip
          if-no-files-found: error

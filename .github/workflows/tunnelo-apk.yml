name: Tunnelo APK

# Запуск вручную: GitHub -> Actions -> "Tunnelo APK" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main, build]
    paths-ignore: ['**.md', 'docs/**']

env:
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # Вложенные субмодули hiddify-sing-box прописаны по SSH — до чекаута
      # переписываем на HTTPS (репо публичные, токен не нужен).
      - name: Rewrite submodule SSH URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v4
        with:
          # рекурсивно: у hiddify-sing-box есть вложенные субмодули replace/*
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Ядро собираем из сабмодуля с Tunnelo-оверлеем (dns/route для РФ),
      # а не скачиваем чужой бинарник из релизов hiddify-next-core.
      - name: Apply core overlay
        run: cp core-overlay/v2/config/*.go hiddify-core/v2/config/

      # Готовый AAR кэшируется по содержимому оверлея и коммиту ядра:
      # пока ядро не менялось, gomobile пропускается (~5 мин экономии).
      - name: Record core commit for cache key
        run: git -C hiddify-core rev-parse HEAD > .core-commit

      - name: Cache core AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: hiddify-core/bin/hiddify-core.aar
          key: core-aar-${{ runner.os }}-${{ hashFiles('core-overlay/**', '.core-commit') }}

      - name: Build core (skipped on cache hit)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        # AAR остаётся в hiddify-core/bin/, чтобы его забрал post-кэш
        run: make tunnelo-build-core

      - name: Place AAR for gradle (always)
        run: |
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/

      - name: Prepare (flutter deps, кодогенерация)
        run: make tunnelo-android-prepare CHANNEL=prod

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi
          flutter build apk --release

      - name: Собрать результаты
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/*arm64-v8a*.apk   out/Tunnelo-arm64.apk    || true
          cp build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/Tunnelo-arm7.apk     || true
          cp build/app/outputs/flutter-apk/app-release.apk   out/Tunnelo-universal.apk || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: Tunnelo-APK
          path: out/*.apk
          retention-days: 30

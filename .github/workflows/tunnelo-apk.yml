name: Tunnelo APK

# Запуск вручную: GitHub -> Actions -> "Tunnelo APK" -> Run workflow
on:
  workflow_dispatch:
  push:
    branches: [main, build]
    paths-ignore: ['**.md', 'docs/**']

env:
  CHANNEL: prod
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Prepare (geo-assets, gomobile, ядро sing-box)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: make android-apk-prepare CHANNEL=prod

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi
          flutter build apk --release

      - name: Собрать результаты
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/*arm64-v8a*.apk   out/Tunnelo-arm64.apk    || true
          cp build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/Tunnelo-arm7.apk     || true
          cp build/app/outputs/flutter-apk/app-release.apk   out/Tunnelo-universal.apk || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: Tunnelo-APK
          path: out/*.apk
          retention-days: 30

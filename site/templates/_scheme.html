<!-- Схема раздельной маршрутизации: главное отличие продукта.
     Рисуется кодом, а не картинкой — чёткая на любом экране. -->
<div class="scheme">
  <svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Российские сайты идут напрямую, заблокированные — через туннель">

    <!-- телефон -->
    <rect x="24" y="118" width="86" height="150" rx="16" fill="#fff" stroke="#DCEBE3" stroke-width="2"/>
    <rect x="36" y="132" width="62" height="112" rx="8" fill="#EDF7F2"/>

      <rect x="6.5" y="6.5" width="19" height="19" rx="6" stroke="#4E9C87" stroke-width="2.4" fill="none" opacity=".8"/>
      <circle cx="16" cy="16" r="3.4" fill="#4E9C87"/>
    </g>
    <text x="67" y="292" text-anchor="middle" class="s-cap">ваше устройство</text>

    <!-- развилка -->
    <circle cx="196" cy="193" r="7" fill="#4E9C87"/>

    <!-- верхняя ветка: напрямую -->
    <path d="M196 193 C 280 193, 300 96, 384 96" stroke="#4E9C87" stroke-width="3" fill="none"/>
    <polygon points="384,90 396,96 384,102" fill="#4E9C87"/>

    <!-- нижняя ветка: через туннель -->

    <polygon points="384,262 396,268 384,274" fill="#F97B5E"/>

    <text x="428" y="300" class="s-note">открываются с зарубежного адреса</text>

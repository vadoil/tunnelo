<!-- Как делится трафик. Раньше это была SVG-картинка с белыми плашками —
     на тёмной странице они торчали заплатками. Теперь обычная вёрстка:
     чёткая на любом экране и перекрашивается вместе с палитрой. -->
<div class="flow">

  <div class="flow-head">
    <div class="node">
      <span class="node-ic">📱</span>
      <span>{{ t.flow_device }}</span>
    </div>
    <span class="flow-line"></span>
    <div class="node node-brand">
      <img class="node-fox" src="/static/fox/lantern.png" alt="">
      <span>{{ t.flow_brand_1 }}<br>{{ t.flow_brand_2 }}</span>
    </div>
  </div>

  <div class="flow-stem"></div>

  <div class="flow-split">
    <div class="branch branch-direct">
      <div class="branch-tag">{{ t.flow_direct_tag }}</div>
      <div class="branch-list">Госуслуги · Сбербанк · Т-Банк · Ozon · Wildberries · Avito · Яндекс</div>
      <div class="branch-why">{{ t.flow_direct_why }}</div>
    </div>

    <div class="branch branch-tunnel">
      <div class="branch-tag">{{ t.flow_tunnel_tag }}</div>
      <div class="branch-list">YouTube · ChatGPT · Spotify · GitHub · Steam</div>
      <div class="branch-why">{{ t.flow_tunnel_why }}</div>
    </div>
  </div>
</div>

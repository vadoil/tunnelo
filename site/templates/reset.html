{% extends "base.html" %}
{% block title %}{{ t.title_reset }}{% endblock %}
{% block body %}
<div class="wrap wrap-narrow">
  <img class="cab-fox" src="/static/fox/lantern.png" alt="">
  <h1>{{ t.reset_h }}</h1>

  {% if not token %}
    <p class="sub">{{ t.reset_broken }}</p>
    <p class="note"><a href="/cabinet/forgot">{{ t.reset_ask_new }}</a></p>
  {% else %}
    <p class="sub">{{ t.reset_sub }}</p>
    {% if error %}<div class="msg err">{{ error }}</div>{% endif %}
    <form method="post" action="/cabinet/reset" class="cab-form">
      <input type="hidden" name="token" value="{{ token }}">
      <input class="field" name="password" type="password" minlength="8"
             placeholder="{{ t.cab_pw_new }}" autocomplete="new-password" autofocus required>
      <input class="field" name="password2" type="password" minlength="8"
             placeholder="{{ t.cab_pw_again }}" autocomplete="new-password" required>
      <button class="btn btn-primary" type="submit">{{ t.reset_btn }}</button>
    </form>
    <p class="note">{{ t.reset_note }}</p>
  {% endif %}
</div>
{% endblock %}
